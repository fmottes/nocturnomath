[project]
name = "nocturnomath"
version = "0.2.0"
description = "A hypothesis-driven scientific probing tool with a persistent Jupyter kernel and citable research record."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Francesco Mottes" }]
requires-python = ">=3.12"
keywords = ["agents", "jupyter", "research", "scientific-computing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "claude-agent-sdk>=0.2.152",
    "fastapi>=0.115.0",
    "jupyter-client>=8.10.0",
    "prompt-toolkit>=3.0.53",
    "rich>=15.0.0",
    "uv>=0.12.12",
    "uvicorn>=0.34.0",
    "websockets>=13.0",
]

[project.urls]
Homepage = "https://github.com/fmottes/nocturnomath"
Repository = "https://github.com/fmottes/nocturnomath"
Issues = "https://github.com/fmottes/nocturnomath/issues"

[project.scripts]
nocturnomath = "nocturnomath.cli.web:main"
nocturnomath-cli = "nocturnomath.cli.terminal:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nocturnomath"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.6.2",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]

[tool.ruff.lint]
# Ruff's defaults otherwise. BLE001 fires on every boundary guard in the server:
# an event subscriber, a transcript append, a websocket send, the HTTP 500
# fallback. Catching broadly there is the point — one caller misbehaving must not
# take down a long-running session — and each site logs or reports what it caught.
ignore = ["BLE001"]
