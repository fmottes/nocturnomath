[project]
name = "nocturnomath"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.152",
    "fastapi>=0.115.0",
    "ipykernel>=7.3.0",
    "jupyter-client>=8.10.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "prompt-toolkit>=3.0.53",
    "rich>=15.0.0",
    "uv>=0.12.12",
    "uvicorn>=0.34.0",
    "websockets>=13.0",
]

[project.scripts]
nocturnomath = "nocturnomath.cli.web:main"
nocturnomath-cli = "nocturnomath.cli.terminal:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nocturnomath"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.6.2",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]

[tool.ruff.lint]
# Ruff's defaults otherwise. BLE001 fires on every boundary guard in the server:
# an event subscriber, a transcript append, a websocket send, the HTTP 500
# fallback. Catching broadly there is the point — one caller misbehaving must not
# take down a long-running session — and each site logs or reports what it caught.
ignore = ["BLE001"]
